<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: fej('Regisztráció')}"></head>
<body class="belso">
<nav th:replace="~{fragments :: menu('register')}"></nav>
<header th:replace="~{fragments :: fejlec('Regisztráció', 'A regisztrált látogatók megtekinthetik a beérkezett üzeneteket.')}"></header>

<main class="tartalom">
    <div class="container px-4 px-lg-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="doboz">
                    <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Felhasználónév</label>
                            <input type="text" id="username" class="form-control" th:field="*{username}"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                            <div class="hiba" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Jelszó</label>
                            <input type="password" id="password" class="form-control" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div class="hiba" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-4">
                            <label for="password2" class="form-label">Jelszó még egyszer</label>
                            <input type="password" id="password2" class="form-control" th:field="*{password2}"
                                   th:classappend="${#fields.hasErrors('password2')} ? 'is-invalid'">
                            <div class="hiba" th:if="${#fields.hasErrors('password2')}" th:errors="*{password2}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Regisztráció</button>
                    </form>
                    <p class="small text-center mt-3 mb-0">Van már fiókja? <a th:href="@{/login}">Bejelentkezés</a></p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments :: lablec}"></footer>
<th:block th:replace="~{fragments :: scriptek}"></th:block>
</body>
</html>
