spring.application.name=autokonyv

# --- Adatbázis a rivendell.nje.hu szerveren (Neptun-kód kisbetűvel) ---
spring.datasource.url=jdbc:mariadb://${MYSQL_HOST:localhost}:3306/gvlrpx?useUnicode=true&characterEncoding=utf8
spring.datasource.username=gvlrpx
spring.datasource.password=${DB_PASSWORD:}

# --- Helyi teszteléshez (XAMPP) ezt a három sort kell használni a fenti helyett ---
#spring.datasource.url=jdbc:mariadb://localhost:3306/autokonyv?useUnicode=true&characterEncoding=utf8
#spring.datasource.username=root
#spring.datasource.password=

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
